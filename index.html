<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title for Search Engines -->
    <title>Vikas's Portfolio</title>

    <!-- Description for Search Engines -->
    <meta name="description" content="Welcome to Vikas Gulia's Portfolio. Explore my projects, skills, and expertise in software development, data science, and more." />

    <!-- Open Graph Meta Tags for Social Media (Facebook, Twitter, etc.) -->
    <meta property="og:title" content="Vikas's Portfolio" />
    <meta property="og:description" content="Welcome to Vikas Gulia's Portfolio. Explore my projects, skills, and expertise in software development, data science, and more." />
    <meta property="og:image" content="https://as2.ftcdn.net/v2/jpg/01/43/00/99/1000_F_143009916_HMJKrrYDQYKTNRSwSlrUZadAwtC10t78.jpg" />
    <meta property="og:url" content="https://vikasguliaportfolio.netlify.app/" /> <!-- Replace with your domain -->
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="https://as2.ftcdn.net/v2/jpg/01/43/00/99/1000_F_143009916_HMJKrrYDQYKTNRSwSlrUZadAwtC10t78.jpg" />

    <!-- Keywords for SEO -->
    <meta name="keywords" content="Vikas Gulia, Portfolio,vikasguliaportfolio, Web Developer, Software Engineer, Data Science, Projects" />

    <!-- Robots Meta Tag (Allowing Search Engines to Index the Page) -->
    <meta name="robots" content="index, follow" />
    
    <!-- Twitter Card Meta Tags for Social Sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vikas's Portfolio" />
    <meta name="twitter:description" content="Welcome to Vikas Gulia's Portfolio. Explore my projects, skills, and expertise in software development, data science, and more." />
    <meta name="twitter:image" content="https://as2.ftcdn.net/v2/jpg/01/43/00/99/1000_F_143009916_HMJKrrYDQYKTNRSwSlrUZadAwtC10t78.jpg" />
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
